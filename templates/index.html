<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sagrado Chocolates | Cones Trufados Artesanais</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Cinzel & Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <!-- Lucide Icons -->
  <script src="https://cdn.jsdelivr.net/npm/lucide@latest/dist/umd/lucide.min.js"></script>
  <!-- React & ReactDOM -->
  <script crossorigin src="https://cdn.jsdelivr.net/npm/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Babel for JSX -->
  <script src="https://cdn.jsdelivr.net/npm/@babel/standalone/babel.min.js"></script>

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              dark: '#0e0504',
              surface: '#1b0c09',
              card: '#24100c',
              border: '#452019',
              gold: '#E5C07B',
              goldLight: '#F3E2B8',
              goldDark: '#B89745',
              ruby: '#6E121B',
              rubyLight: '#991B28',
              cream: '#FDFBF7',
              muted: '#A99A8E'
            }
          },
          fontFamily: {
            serif: ['"Cinzel"', 'serif'],
            sans: ['"Inter"', 'sans-serif']
          },
          boxShadow: {
            'glow-gold': '0 0 25px -5px rgba(229, 192, 123, 0.3)',
            'glow-ruby': '0 0 30px -5px rgba(153, 27, 40, 0.4)',
          }
        }
      }
    }
  </script>

  <style>
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: #120705; }
    ::-webkit-scrollbar-thumb { background: #3e1b14; border-radius: 9999px; border: 1px solid rgba(229, 192, 123, 0.2); }
    ::-webkit-scrollbar-thumb:hover { background: #B89745; }

    .glass-panel {
      background: rgba(27, 12, 9, 0.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(229, 192, 123, 0.2);
    }
    .glass-card {
      background: linear-gradient(145deg, rgba(36, 16, 12, 0.85) 0%, rgba(20, 8, 6, 0.95) 100%);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(229, 192, 123, 0.15);
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .glass-card:hover {
      border-color: rgba(229, 192, 123, 0.45);
      transform: translateY(-4px);
      box-shadow: 0 16px 32px -8px rgba(0, 0, 0, 0.7), 0 0 20px rgba(229, 192, 123, 0.15);
    }

    .btn-shimmer {
      position: relative;
      overflow: hidden;
    }
    .btn-shimmer::after {
      content: '';
      position: absolute;
      top: 0; right: 0; bottom: 0; left: 0;
      transform: translateX(-100%);
      background: linear-gradient(90deg, transparent 0, rgba(255, 255, 255, 0.2) 50%, transparent 100%);
      animation: shimmer 3.5s infinite;
    }
    @keyframes shimmer {
      100% { transform: translateX(100%); }
    }
  </style>

  <script>
    window.addEventListener('error', function(e) {
      console.error("Erro detectado na tela:", e);
      var box = document.getElementById('erro-carregamento');
      if (box) {
        box.style.display = 'block';
        box.innerHTML = '<strong>⚠️ Erro ao carregar a loja:</strong><br>' + 
          (e.message || 'Falha ao executar o script React') + 
          '<br><br><small style="color:#fbd38d;">Dica: Limpe o cache do navegador ou verifique a conexão com a internet.</small>';
      }
    });
  </script>
</head>
<body class="bg-brand-dark text-brand-cream font-sans antialiased selection:bg-brand-gold selection:text-brand-dark">

  <!-- Container principal com tela de carregamento inicial -->
  <div id="root">
    <div style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background-color: #0e0504; color: #E5C07B; font-family: 'Cinzel', serif; text-align: center; padding: 20px;">
      <div style="width: 50px; height: 50px; border: 4px solid #452019; border-top: 4px solid #E5C07B; border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 20px;"></div>
      <h2 style="font-size: 22px; letter-spacing: 4px; margin: 0; font-weight: bold;">SAGRADO CHOCOLATES</h2>
      <p style="font-family: 'Inter', sans-serif; font-size: 13px; color: #A99A8E; margin-top: 8px; letter-spacing: 1px;">Carregando cardápio artesanal...</p>
      <div id="erro-carregamento" style="display:none; margin-top: 25px; padding: 15px; background: #260c0c; border: 1px solid #e53e3e; border-radius: 10px; color: #ffcccc; font-family: sans-serif; font-size: 12px; max-width: 420px; text-align: left;"></div>
    </div>
    <style>
      @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
  </div>

  <script type="text/babel">
{% raw %}
    const { useState, useEffect, useMemo } = React;

    const PRODUTOS_PADRAO = [
      {
        id: 1,
        nome: "Cone Trufado Morango Cremoso",
        categoria: "frutados",
        tag: "Mais Vendido",
        preco: 12.00,
        estoque: 50,
        descricao: "Casquinha artesanal folhada crocante, blindada com chocolate nobre e recheada com ganache aveludada de morangos frescos.",
        img: "https://images.unsplash.com/photo-1549007994-cb92caebd54b?auto=format&fit=crop&w=600&q=80",
        imagens: ["https://images.unsplash.com/photo-1549007994-cb92caebd54b?auto=format&fit=crop&w=600&q=80"],
        rating: 4.9
      },
      {
        id: 2,
        nome: "Cone Trufado Doce de Leite Imperial",
        categoria: "classicos",
        tag: "Receita Nobre",
        preco: 11.00,
        estoque: 45,
        descricao: "Doce de leite de cozimento lento em tacho, toque sutil de flor de sal e casquinha banhada no chocolate meio amargo.",
        img: "https://images.unsplash.com/photo-1587314168485-3236d6710814?auto=format&fit=crop&w=600&q=80",
        imagens: ["https://images.unsplash.com/photo-1587314168485-3236d6710814?auto=format&fit=crop&w=600&q=80"],
        rating: 5.0
      },
      {
        id: 3,
        nome: "Cone Trufado Brigadeiro Gourmet 70%",
        categoria: "classicos",
        tag: "Favorito do Chef",
        preco: 10.00,
        estoque: 60,
        descricao: "Brigadeiro aveludado feito com cacau nobre puro e casquinha crocante banhada no chocolate ao leite belga.",
        img: "https://images.unsplash.com/photo-1579372786545-d24232daf58c?auto=format&fit=crop&w=600&q=80",
        imagens: ["https://images.unsplash.com/photo-1579372786545-d24232daf58c?auto=format&fit=crop&w=600&q=80"],
        rating: 4.8
      }
    ];

    function App() {
      const [produtos, setProdutos] = useState(PRODUTOS_PADRAO);
      
      const [carrinho, setCarrinho] = useState(() => {
        const saved = localStorage.getItem('sagrado_carrinho');
        return saved ? JSON.parse(saved) : [];
      });

      const [usuario, setUsuario] = useState(() => {
        const saved = localStorage.getItem('sagrado_usuario');
        return saved ? JSON.parse(saved) : null;
      });

      const [isCartOpen, setIsCartOpen] = useState(false);
      const [isAuthModalOpen, setIsAuthModalOpen] = useState(false);
      const [authTab, setAuthTab] = useState('entrar');
      const [isContaModalOpen, setIsContaModalOpen] = useState(false);
      const [quickViewProduct, setQuickViewProduct] = useState(null);
      const [imgIndexModal, setImgIndexModal] = useState(0);

      const [fiados, setFiados] = useState([]);
      const [fiadoParaPagar, setFiadoParaPagar] = useState(null);
      const [comprovanteBase64, setComprovanteBase64] = useState('');
      const [enviandoComprovante, setEnviandoComprovante] = useState(false);

      const [infoPix, setInfoPix] = useState({
        chave_pix: 'sagradochocolates@gmail.com',
        beneficiario: 'Sagrado Chocolates'
      });

      const [categoriaAtiva, setCategoriaAtiva] = useState('todos');
      const [busca, setBusca] = useState('');
      const [toasts, setToasts] = useState([]);

      const [authNome, setAuthNome] = useState('');
      const [authEmail, setAuthEmail] = useState('');
      const [authSenha, setAuthSenha] = useState('');
      const [authTelefone, setAuthTelefone] = useState('');
      const [authLoading, setAuthLoading] = useState(false);

      useEffect(() => {
        carregarProdutosServidor();
        carregarInfoPix();
      }, []);

      useEffect(() => {
        localStorage.setItem('sagrado_carrinho', JSON.stringify(carrinho));
      }, [carrinho]);

      useEffect(() => {
        if (usuario) {
          localStorage.setItem('sagrado_usuario', JSON.stringify(usuario));
          carregarMeusFiados(usuario.id);
        } else {
          localStorage.removeItem('sagrado_usuario');
          setFiados([]);
        }
      }, [usuario]);

      useEffect(() => {
        if (window.lucide) window.lucide.createIcons();
      }, [produtos, carrinho, isCartOpen, isAuthModalOpen, isContaModalOpen, quickViewProduct, fiadoParaPagar, fiados, toasts]);

      const addToast = (mensagem, tipo = 'info') => {
        const id = Date.now();
        setToasts(prev => [...prev, { id, mensagem, tipo }]);
        setTimeout(() => setToasts(prev => prev.filter(t => t.id !== id)), 4000);
      };

      async function carregarProdutosServidor() {
        try {
          const res = await fetch('/api/produtos');
          const data = await res.json();
          if (Array.isArray(data) && data.length > 0) {
            setProdutos(data);
          }
        } catch (e) {
          console.error("Erro ao carregar produtos:", e);
        }
      }

      async function carregarInfoPix() {
        try {
          const res = await fetch('/api/admin/info-pix');
          const data = await res.json();
          if (data && data.chave_pix) setInfoPix(data);
        } catch (e) {
          console.error(e);
        }
      }

      async function carregarMeusFiados(usuarioId) {
        try {
          const res = await fetch(`/api/cliente/fiados?usuario_id=${usuarioId}`);
          const data = await res.json();
          if (Array.isArray(data)) {
            setFiados(data);
          }
        } catch (e) {
          console.error(e);
        }
      }

      async function handleCadastro(e) {
        e.preventDefault();
        setAuthLoading(true);
        try {
          const res = await fetch('/api/cliente/cadastro', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              nome: authNome,
              email: authEmail,
              senha: authSenha,
              telefone: authTelefone
            })
          });
          const data = await res.json();
          if (res.ok) {
            setUsuario(data.usuario);
            setIsAuthModalOpen(false);
            addToast(`Bem-vindo(a), ${data.usuario.nome}!`, 'sucesso');
            setAuthNome(''); setAuthEmail(''); setAuthSenha(''); setAuthTelefone('');
          } else {
            addToast(data.erro || 'Erro ao criar conta.');
          }
        } catch (err) {
          addToast('Erro de conexão com o servidor.');
        } finally {
          setAuthLoading(false);
        }
      }

      async function handleLogin(e) {
        e.preventDefault();
        setAuthLoading(true);
        try {
          const res = await fetch('/api/cliente/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              email: authEmail,
              senha: authSenha
            })
          });
          const data = await res.json();
          if (res.ok) {
            setUsuario(data.usuario);
            setIsAuthModalOpen(false);
            addToast(`Olá novamente, ${data.usuario.nome}!`, 'sucesso');
            setAuthEmail(''); setAuthSenha('');
          } else {
            addToast(data.erro || 'E-mail ou senha incorretos.');
          }
        } catch (err) {
          addToast('Erro ao conectar com o servidor.');
        } finally {
          setAuthLoading(false);
        }
      }

      function handleLogout() {
        setUsuario(null);
        setIsContaModalOpen(false);
        addToast('Você saiu da sua conta.');
      }

      function abrirModalPagarPix(fiado) {
        setFiadoParaPagar(fiado);
        setComprovanteBase64('');
      }

      function copiarChavePix() {
        navigator.clipboard.writeText(infoPix.chave_pix);
        addToast('Chave PIX copiada!', 'sucesso');
      }

      function processarComprovanteArquivo(event) {
        const file = event.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function(e) {
          setComprovanteBase64(e.target.result);
          addToast('Comprovante carregado!');
        };
        reader.readAsDataURL(file);
      }

      async function enviarComprovantePagamento() {
        if (!comprovanteBase64) {
          return addToast('Anexe a foto do comprovante primeiro!');
        }

        setEnviandoComprovante(true);
        try {
          const res = await fetch('/api/cliente/fiados/anexar-comprovante', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              fiado_id: fiadoParaPagar.id,
              comprovante: comprovanteBase64
            })
          });
          const data = await res.json();
          if (res.ok) {
            addToast('Comprovante enviado para o vendedor!', 'sucesso');
            setFiadoParaPagar(null);
            setComprovanteBase64('');
            if (usuario) carregarMeusFiados(usuario.id);
          } else {
            addToast(data.erro || 'Erro ao enviar comprovante.');
          }
        } catch (e) {
          addToast('Erro de conexão com o servidor.');
        } finally {
          setEnviandoComprovante(false);
        }
      }

      const adicionarAoCarrinho = (produto, e) => {
        if (e) e.stopPropagation();
        setCarrinho(prev => {
          const item = prev.find(i => i.id === produto.id);
          if (item) {
            return prev.map(i => i.id === produto.id ? { ...i, quantidade: i.quantidade + 1 } : i);
          }
          return [...prev, { ...produto, quantidade: 1 }];
        });
        addToast(`Adicionado: ${produto.nome}`);
      };

      const alterarQuantidade = (id, delta) => {
        setCarrinho(prev =>
          prev.map(i => i.id === id ? { ...i, quantidade: i.quantidade + delta } : i)
              .filter(i => i.quantidade > 0)
        );
      };

      const removerDoCarrinho = (id) => {
        setCarrinho(prev => prev.filter(i => i.id !== id));
        addToast("Item removido da sacola.");
      };

      const totalItens = useMemo(() => carrinho.reduce((acc, i) => acc + i.quantidade, 0), [carrinho]);
      const subtotalFinanceiro = useMemo(() => carrinho.reduce((acc, i) => acc + (i.preco * i.quantidade), 0), [carrinho]);
      const totalDevendoCliente = useMemo(() => {
        return fiados.filter(f => f.status !== 'pago').reduce((acc, f) => acc + f.valor, 0);
      }, [fiados]);

      const produtosFiltrados = useMemo(() => {
        return produtos.filter(p => {
          const matchCat = categoriaAtiva === 'todos' || p.categoria === categoriaAtiva;
          const matchBusca = (p.nome || '').toLowerCase().includes(busca.toLowerCase()) ||
                             (p.descricao || '').toLowerCase().includes(busca.toLowerCase());
          return matchCat && matchBusca;
        });
      }, [produtos, categoriaAtiva, busca]);

      const finalizarPedidoWhatsApp = () => {
        if (carrinho.length === 0) return addToast("A sacola está vazia.");
        let texto = `*Olá, Sagrado Chocolates! Gostaria de fazer um pedido artesanal:*\n\n`;
        if (usuario) {
          texto += `*Cliente:* ${usuario.nome} (${usuario.email})\n\n`;
        }
        carrinho.forEach(item => {
          texto += `• ${item.quantidade}x ${item.nome} - R$ ${(item.preco * item.quantidade).toFixed(2).replace('.', ',')}\n`;
        });
        texto += `\n*Total do Pedido: R$ ${subtotalFinanceiro.toFixed(2).replace('.', ',')}*`;
        texto += `\n\nPor favor, confirmem a disponibilidade!`;

        window.open(`https://wa.me/5516999999999?text=${encodeURIComponent(texto)}`, '_blank');
        setCarrinho([]);
        setIsCartOpen(false);
        addToast("Pedido enviado para o WhatsApp!");
      };

      return (
        <div className="min-h-screen flex flex-col bg-brand-dark">

          <div className="bg-gradient-to-r from-brand-ruby via-brand-surface to-brand-ruby text-brand-gold text-xs py-2 px-4 text-center font-medium border-b border-brand-gold/20 flex items-center justify-center gap-2">
            <span className="w-2 h-2 rounded-full bg-brand-gold animate-pulse"></span>
            <span>Edição Especial: Cones Trufados Artesanais com Cacau Nobre</span>
          </div>

          <header className="sticky top-0 z-40 glass-panel border-b border-brand-gold/20">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
              
              <div className="flex items-center gap-3 cursor-pointer" onClick={() => window.scrollTo({ top: 0, behavior: 'smooth' })}>
                <div className="w-11 h-11 rounded-full bg-gradient-to-br from-brand-gold via-brand-goldDark to-brand-ruby flex items-center justify-center shadow-glow-gold border border-brand-gold/40">
                  <span className="font-serif font-black text-brand-dark text-xl">S</span>
                </div>
                <div>
                  <h1 className="font-serif text-xl sm:text-2xl font-bold tracking-widest text-transparent bg-clip-text bg-gradient-to-r from-brand-gold via-brand-goldLight to-brand-gold">
                    SAGRADO
                  </h1>
                  <p className="text-[10px] tracking-[0.25em] text-brand-muted uppercase">Cones Trufados Artesanais</p>
                </div>
              </div>

              <nav className="flex items-center gap-2 sm:gap-3">
                <a
                  href="/admin"
                  className="hidden sm:flex items-center gap-2 px-3 py-2 rounded-lg text-xs font-semibold text-brand-muted hover:text-brand-gold hover:bg-brand-gold/10 transition border border-transparent hover:border-brand-gold/30"
                >
                  <i data-lucide="layout-dashboard" className="w-4 h-4"></i>
                  <span>Painel Admin</span>
                </a>

                <button
                  onClick={() => {
                    if (usuario) {
                      setIsContaModalOpen(true);
                      carregarMeusFiados(usuario.id);
                    } else {
                      setIsAuthModalOpen(true);
                    }
                  }}
                  className="relative flex items-center gap-2 px-3.5 py-2.5 rounded-xl text-xs font-semibold text-brand-cream hover:text-brand-gold hover:bg-brand-card transition border border-brand-border"
                >
                  <i data-lucide="user" className="w-4 h-4 text-brand-gold"></i>
                  <span>{usuario ? `Olá, ${usuario.nome.split(' ')[0]}` : 'Entrar / Criar Conta'}</span>
                  
                  {totalDevendoCliente > 0 && (
                    <span className="w-2.5 h-2.5 rounded-full bg-amber-400 absolute -top-1 -right-1 animate-ping"></span>
                  )}
                </button>

                <button
                  onClick={() => setIsCartOpen(true)}
                  className="btn-shimmer relative flex items-center gap-2.5 px-4 py-2.5 rounded-xl text-sm bg-gradient-to-r from-brand-goldDark to-brand-gold text-brand-dark font-bold shadow-glow-gold hover:brightness-110 active:scale-95 transition"
                >
                  <i data-lucide="shopping-bag" className="w-4 h-4"></i>
                  <span className="hidden sm:inline">Sacola</span>
                  <span className="bg-brand-dark text-brand-gold text-xs font-black px-2 py-0.5 rounded-full border border-brand-gold/40">
                    {totalItens}
                  </span>
                </button>
              </nav>
            </div>
          </header>

          {usuario && totalDevendoCliente > 0 && (
            <div className="bg-amber-950/80 border-b border-amber-600/40 px-4 py-2 text-center text-xs text-amber-200 flex items-center justify-center gap-3">
              <i data-lucide="alert-circle" className="w-4 h-4 text-amber-400"></i>
              <span>Você possui um débito de fiado pendente de <strong>R$ {totalDevendoCliente.toFixed(2).replace('.', ',')}</strong>.</span>
              <button 
                onClick={() => setIsContaModalOpen(true)}
                className="underline text-amber-300 font-bold hover:text-white"
              >
                Pagar com PIX agora
              </button>
            </div>
          )}

          <section className="relative overflow-hidden pt-12 pb-20 border-b border-brand-gold/15 bg-gradient-to-b from-brand-surface via-brand-dark to-brand-dark">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 relative z-10">
              <div className="grid grid-cols-1 lg:grid-cols-12 gap-12 items-center">
                <div className="lg:col-span-7 text-center lg:text-left">
                  <div className="inline-flex items-center gap-2 px-3.5 py-1.5 rounded-full bg-brand-gold/10 border border-brand-gold/30 text-brand-gold text-xs font-semibold uppercase mb-6 backdrop-blur-sm">
                    <i data-lucide="sparkles" className="w-3.5 h-3.5"></i>
                    <span>Cacau Nobre Selecionado & Recheio Cremoso</span>
                  </div>

                  <h2 className="font-serif text-4xl sm:text-5xl lg:text-6xl font-bold tracking-tight text-brand-cream leading-[1.15] mb-6">
                    O Inconfundível <br />
                    <span className="text-transparent bg-clip-text bg-gradient-to-r from-brand-gold via-brand-goldLight to-amber-400">
                      Cone Trufado
                    </span> <br />
                    Artesanal.
                  </h2>

                  <p className="text-brand-muted text-base sm:text-lg max-w-xl mx-auto lg:mx-0 leading-relaxed mb-8">
                    Casquinha ultra crocante por fora e ganache densamente aveludada por dentro. Banhado no mais puro chocolate nobre temperado.
                  </p>

                  <div className="flex flex-wrap items-center justify-center lg:justify-start gap-4">
                    <a
                      href="#catalogo"
                      className="btn-shimmer px-7 py-3.5 rounded-xl bg-gradient-to-r from-brand-ruby to-brand-rubyLight text-brand-cream font-semibold shadow-glow-ruby hover:brightness-110 transition flex items-center gap-2"
                    >
                      <span>Ver Cardápio</span>
                      <i data-lucide="arrow-right" className="w-4 h-4"></i>
                    </a>

                    {!usuario ? (
                      <button
                        onClick={() => { setIsAuthModalOpen(true); setAuthTab('cadastrar'); }}

                  <label className="flex flex-col items-center justify-center p-4 border-2 border-dashed border-brand-gold/40 hover:border-brand-gold rounded-xl cursor-pointer bg-brand-dark/50 hover:bg-brand-gold/5 transition group">
                    <i data-lucide="upload" className="w-6 h-6 text-brand-gold group-hover:scale-110 transition"></i>
                    <span className="text-xs font-bold text-brand-gold mt-1.5">Escolher Comprovante (Galeria/Arquivos)</span>
                    <input type="file" accept="image/*" onChange={processarComprovanteArquivo} className="hidden" />
                  </label>

                  {comprovanteBase64 && (
                    <div className="relative rounded-xl overflow-hidden border border-emerald-500 h-28 bg-brand-dark">
                      <img src={comprovanteBase64} alt="Comprovante" className="w-full h-full object-contain" />
                      <span className="absolute bottom-1 right-2 text-[10px] bg-emerald-950 text-emerald-300 px-2 py-0.5 rounded-full font-bold">
                        Anexado com sucesso ✓
                      </span>
                    </div>
                  )}
                </div>

                <div className="flex items-center gap-3">
                  <button
                    onClick={() => setFiadoParaPagar(null)}
                    className="flex-1 py-3 rounded-xl border border-brand-border text-xs text-brand-muted hover:text-brand-cream"
                  >
                    Cancelar
                  </button>
                  <button
                    onClick={enviarComprovantePagamento}
                    disabled={enviandoComprovante || !comprovanteBase64}
                    className="btn-shimmer flex-1 py-3 rounded-xl bg-gradient-to-r from-emerald-600 to-emerald-500 text-white font-bold text-xs shadow-lg hover:brightness-110 transition disabled:opacity-50"
                  >
                    {enviandoComprovante ? 'Enviando...' : 'Enviar Comprovante'}
                  </button>
                </div>
              </div>
            </div>
          )}

          {isCartOpen && (
            <div className="fixed inset-0 z-50 overflow-hidden">
              <div className="absolute inset-0 bg-black/70 backdrop-blur-sm" onClick={() => setIsCartOpen(false)}></div>
              <div className="fixed inset-y-0 right-0 max-w-full flex pl-10">
                <div className="w-screen max-w-md glass-panel bg-brand-dark/95 border-l border-brand-gold/30 flex flex-col justify-between shadow-2xl">
                  <div className="p-6 border-b border-brand-border/80 flex items-center justify-between">
                    <div className="flex items-center gap-2">
                      <i data-lucide="shopping-bag" className="w-5 h-5 text-brand-gold"></i>
                      <h3 className="font-serif text-xl font-bold text-brand-cream">Sua Sacola Gourmet</h3>
                    </div>
                    <button onClick={() => setIsCartOpen(false)} className="p-2 text-brand-muted hover:text-brand-cream">
                      <i data-lucide="x" className="w-5 h-5"></i>
                    </button>
                  </div>

                  <div className="px-6 py-3 bg-brand-surface/70 border-b border-brand-border/40 text-xs">
                    <div className="flex justify-between mb-1.5">
                      <span className="text-brand-muted">Frete Grátis a partir de R$ 50,00</span>
                      <span className="font-bold text-brand-gold">
                        {subtotalFinanceiro >= 50 ? 'Garantido!' : `Faltam R$ ${(50 - subtotalFinanceiro).toFixed(2).replace('.', ',')}`}
                      </span>
                    </div>
                    <div className="w-full bg-brand-card rounded-full h-1.</span>
                    </div>
                    <div className="w-full bg-brand-card rounded-full h-1.5 overflow-hidden">
                      <div
                        className="bg-brand-gold h-full transition-all duration-300"
                        style={{ width: `${Math.min(100, (subtotalFinanceiro / 50) * 100)}%` }}
                      ></div>
                    </div>
                  </div>

                  <div className="flex-1 overflow-y-auto p-6 space-y-4">
                    {carrinho.length === 0 ? (
                      <p className="text-center text-brand-muted py-20 text-sm">Sua sacola está vazia.</p>
                    ) : (
                      carrinho.map(item => (
                        <div key={item.id} className="flex items-center gap-4 p-3 rounded-xl bg-brand-surface/60 border border-brand-border/60">
                          <img src={item.img} alt={item.nome} className="w-14 h-14 object-cover rounded-lg" />
                          <div className="flex-1 min-w-0">
                            <h4 className="font-semibold text-sm text-brand-cream truncate">{item.nome}</h4>
                            <span className="text-xs text-brand-gold font-bold">R$ {item.preco.toFixed(2).replace('.', ',')}</span>
                            <div className="flex items-center gap-2 mt-2">
                              <button onClick={() => alterarQuantidade(item.id, -1)} className="w-6 h-6 rounded bg-brand-card text-brand-cream text-xs">-</button>
                              <span className="text-xs font-bold w-4 text-center">{item.quantidade}</span>
                              <button onClick={() => alterarQuantidade(item.id, 1)} className="w-6 h-6 rounded bg-brand-card text-brand-cream text-xs">+</button>
                            </div>
                          </div>
                          <div className="flex flex-col items-end justify-between self-stretch">
                            <button onClick={() => removerDoCarrinho(item.id)} className="text-brand-muted hover:text-rose-400">
                              <i data-lucide="trash-2" className="w-4 h-4"></i>
                            </button>
                            <span className="font-serif font-bold text-sm text-brand-cream">
                              R$ {(item.preco * item.quantidade).toFixed(2).replace('.', ',')}
                            </span>
                          </div>
                        </div>
                      ))
                    )}
                  </div>

                  {carrinho.length > 0 && (
                    <div className="p-6 border-t border-brand-border/80 bg-brand-surface/40 space-y-4">
                      <div className="flex justify-between text-base font-bold text-brand-cream">
                        <span>Total:</span>
                        <span className="font-serif text-xl text-brand-gold">R$ {subtotalFinanceiro.toFixed(2).replace('.', ',')}</span>
                      </div>

                      <button
                        onClick={finalizarPedidoWhatsApp}
                        className="btn-shimmer w-full py-3.5 rounded-xl bg-[#25D366] hover:bg-[#1EBE5D] text-black font-bold text-sm flex items-center justify-center gap-2 shadow-lg transition"
                      >
                        <i data-lucide="message-circle" className="w-4 h-4"></i>
                        <span>Pedir no WhatsApp</span>
                      </button>
                    </div>
                  )}
                </div>
              </div>
            </div>
          )}

          <div className="fixed bottom-5 right-5 z-50 flex flex-col gap-2.5 pointer-events-none">
            {toasts.map(t => (
              <div key={t.id} className="pointer-events-auto px-4 py-3 rounded-2xl glass-panel border border-brand-gold/40 shadow-glow-gold text-brand-cream text-xs font-semibold flex items-center gap-3">
                <div className={`w-2 h-2 rounded-full ${t.tipo === 'sucesso' ? 'bg-emerald-400' : 'bg-brand-gold'} animate-ping`}></div>
                <span>{t.mensagem}</span>
              </div>
            ))}
          </div>

        </div>
      );
    }

    const rootElem = document.getElementById('root');
    if (ReactDOM.createRoot) {
      ReactDOM.createRoot(rootElem).render(<App />);
    } else {
      ReactDOM.render(<App />, rootElem);
    }
{% endraw %}
  </script>
</body>
</html>
