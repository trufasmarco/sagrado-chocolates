<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sagrado Chocolates | Cones Trufados Artesanais</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>

  <header>
    <div class="logo">Sagrado Chocolates</div>
    <nav>
      <button onclick="abrirModal('modalCarrinho')">Carrinho (<span id="cart-count">0</span>)</button>
      <button onclick="abrirModal('modalLogin')">Login</button>
      <button onclick="abrirModal('modalAdmin')">Painel Admin</button>
    </nav>
  </header>

  <section class="hero">
    <img src="{{ url_for('static', filename='banner_principal.png') }}" alt="Banner Sagrado Chocolates - Cones Trufados" class="hero-banner-img">
  </section>

  <main class="container">
    <h2 class="section-title">Nossos Sabores</h2>
    <div class="grid-produtos" id="produtos-container">
      <!-- Inserido via JavaScript -->
    </div>
  </main>

  <div class="modal" id="modalCarrinho">
    <div class="modal-content">
      <span class="close-btn" onclick="fecharModal('modalCarrinho')">×</span>
      <h3 style="color: var(--gold); margin-bottom: 1rem;">Seu Carrinho</h3>
      <div id="itens-carrinho">
        <p>O carrinho está vazio.</p>
      </div>
      <hr style="margin: 1rem 0; border-color: var(--gold);">
      <p style="font-size: 1.2rem; font-weight: bold; display: flex; justify-content: space-between;">
        <span>Total:</span> <span>R$ <span id="total-carrinho">0,00</span></span>
      </p>
      <button class="btn-comprar" style="margin-top: 1rem;" onclick="finalizarPedido()">Finalizar Pedido</button>
    </div>
  </div>

  <div class="modal" id="modalLogin">
    <div class="modal-content">
      <span class="close-btn" onclick="fecharModal('modalLogin')">×</span>
      <h3 style="color: var(--gold); margin-bottom: 1rem;">Acesse sua Conta</h3>
      <form onsubmit="handleLogin(event)">
        <div class="form-group">
          <label for="login-email">E-mail</label>
          <input type="email" id="login-email" required placeholder="seu@email.com">
        </div>
        <div class="form-group">
          <label for="login-senha">Senha</label>
          <input type="password" id="login-senha" required placeholder="******">
        </div>
        <button class="btn-comprar" type="submit">Entrar</button>
      </form>
    </div>
  </div>

  <div class="modal" id="modalAdmin">
    <div class="modal-content" style="max-width: 800px;">
      <span class="close-btn" onclick="fecharModal('modalAdmin')">×</span>
      <h3 style="color: var(--gold); margin-bottom: 1rem;">Painel de Gestão</h3>
      <p style="margin-bottom: 1rem;">Para cadastrar novos produtos, acesse a <a href="/admin" style="color: var(--gold);">Tela de Cadastro Administrativo</a>.</p>
    </div>
  </div>

  <div id="toast-container"></div>

  <script src="/static/script.js"></script>
</body>
</html>
