<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sagrado Chocolates | Cones Trufados Artesanais</title>
  <!-- Conecta o arquivo CSS -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Cabeçalho -->
  <header>
    <div class="logo">Sagrado Chocolates</div>
    <nav>
      <button onclick="abrirModal('modalCarrinho')">Carrinho (<span id="cart-count">0</span>)</button>
      <button onclick="abrirModal('modalLogin')">Login</button>
      <button onclick="abrirModal('modalAdmin')">Painel Admin</button>
    </nav>
  </header>

  <!-- Banner Hero -->
  <section class="hero">
    <img src="banner_principal.png" alt="Banner Sagrado Chocolates - Cones Trufados" class="hero-banner-img">
  </section>

  <!-- Catálogo -->
  <main class="container">
    <h2 class="section-title">Nossos Sabores</h2>
    <div class="grid-produtos" id="produtos-container">
      <!-- Produtos inseridos via JavaScript -->
    </div>
  </main>

  <!-- Modal Carrinho -->
  <div class="modal" id="modalCarrinho">
    <div class="modal-content">
      <span class="close-btn" onclick="fecharModal('modalCarrinho')">×</span>
      <h3 style="color: var(--gold); margin-bottom: 1rem;">Seu Carrinho</h3>
      <div id="itens-carrinho">
        <p>O carrinho está vazio.</p>
      </div>
      <hr style="margin: 1rem 0; border-color: var(--gold);">
      <p style="font-size: 1.2rem; font-weight: bold; display: flex; justify-content: space-between;">
        <span>Total:</span> <span>R$ <span id="total-carrinho">0,00</span></span>
      </p>
      <button class="btn-comprar" style="margin-top: 1rem;" onclick="finalizarPedido()">Finalizar Pedido</button>
    </div>
  </div>

  <!-- Modal Login -->
  <div class="modal" id="modalLogin">
    <div class="modal-content">
      <span class="close-btn" onclick="fecharModal('modalLogin')">×</span>
      <h3 style="color: var(--gold); margin-bottom: 1rem;">Acesse sua Conta</h3>
      <form onsubmit="handleLogin(event)">
        <div class="form-group">
          <label for="login-email">E-mail</label>
          <input type="email" id="login-email" required placeholder="seu@email.com">
        </div>
        <div class="form-group">
          <label for="login-senha">Senha</label>
          <input type="password" id="login-senha" required placeholder="******">
        </div>
        <button class="btn-comprar" type="submit">Entrar</button>
      </form>
    </div>
  </div>

  <!-- Modal Admin -->
  <div class="modal" id="modalAdmin">
    <div class="modal-content" style="max-width: 800px;">
      <span class="close-btn" onclick="fecharModal('modalAdmin')">×</span>
      <h3 style="color: var(--gold); margin-bottom: 1rem;">Painel de Gestão Integrada</h3>
      
      <div class="dashboard-grid">  
        <div class="dash-card">  
          <h4>Vendas Hoje</h4>  
          <p id="dash-vendas">R$ 0,00</p>  
        </div>  
        <div class="dash-card">  
          <h4>Estoque Total</h4>  
          <p id="dash-estoque">250 un</p>  
        </div>  
        <div class="dash-card">  
          <h4>Lucro Estimado</h4>  
          <p>65%</p>  
        </div>  
      </div>  
      
      <h4 style="color: var(--gold); margin-top: 1rem;">Gerenciamento de Estoque e Valores</h4>  
      <div style="overflow-x: auto;">
        <table>  
          <thead>  
            <tr>  
              <th>Sabor</th>  
              <th>Qtd Estoque</th>  
              <th>Preço Venda</th>  
              <th>Ação</th>  
            </tr>  
          </thead>  
          <tbody id="tabela-estoque">  
            <!-- Gerado via JS -->  
          </tbody>  
        </table>
      </div>  
    </div>
  </div>

  <!-- Container para Notificações -->
  <div id="toast-container"></div>

  <!-- Conecta o arquivo JavaScript -->
  <script src="script.js"></script>
</body>
</html>
